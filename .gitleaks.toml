# Gitleaks config for wg-manager. Extends the default ruleset and adds
# a narrow per-file allowlist for committed test fixtures and dashboard
# placeholder strings. New files added to tests/ are NOT auto-exempt —
# every entry below was reviewed and is documented. If a fresh file
# legitimately needs to land here, add it explicitly so the reviewer
# sees the diff and confirms the secret-shape is non-production.

title = "wg-manager gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Test-fixture PEMs and placeholder strings — no production secrets"
paths = [
  # Ephemeral Ed25519/RSA private keys generated in-memory inside test
  # fixtures; never reach the network. Each file's module docstring
  # explains why the bytes are inline.
  '''^tests/test_crypto\.py$''',
  '''^tests/test_model_repr\.py$''',
  '''^tests/test_ssh_key_mode\.py$''',
  '''^tests/test_ssh_keys_api\.py$''',
  '''^tests/test_ssh_migrate\.py$''',
  '''^tests/test_cli_ssh_migrate\.py$''',
  '''^tests/test_tasks_crypto\.py$''',
  '''^tests/test_tasks_provision_bootstrap\.py$''',
  # PKCS#8-conversion unit tests. No committed key material — the file
  # only contains string literals for `-----BEGIN PRIVATE KEY-----` used
  # in `.startswith()` assertions against PEMs generated at runtime by
  # cryptography.hazmat. Gitleaks matches on the header shape regardless
  # of whether real key bytes follow.
  '''^tests/test_bootstrap_mysql_tls_pkcs8\.py$''',
  # Published dev Fernet key. The conftest header documents that this
  # value is in the repo on purpose — the suite needs deterministic
  # encrypt() output across runs.
  '''^tests/e2e/tls/conftest\.py$''',
  # PEM-shaped textarea placeholder rendered in the SSH-roles form, not
  # a real key.
  '''^web/app/ssh-keys/page\.tsx$''',
  # PEM-shaped textarea placeholder in the Register-server bootstrap-key
  # field ("-----BEGIN OPENSSH PRIVATE KEY-----\n<contents...>"), not a
  # real key. Operator-pasted keys are encrypted client-side and never
  # committed.
  '''^web/app/servers/page\.tsx$''',
]
# Header-only PEM mentions in prose and assertions, e.g. the docs line
# "SEC1 (``-----BEGIN EC PRIVATE KEY-----``) is rejected by MySQL". The
# default private-key rule matches from one header to the next
# "KEY-----" 64+ chars later, so two such mentions in one paragraph read
# as a single "key". Allowlisted by *shape*, not path, so a real key
# pasted into CHANGELOG.md or scripts/bootstrap_mysql_tls_files.py still
# fails: the match must open with a header immediately closed by ``
# (RST/Markdown literal) or ") / ') (string literal) — a genuine PEM
# header is always followed by a newline and a base64 body.
regexTarget = "match"
regexes = [
  '''^-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY-----(``|["']\))''',
]
