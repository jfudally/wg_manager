# ===========================================================================
# Production-shaped docker-compose overlay (single-host, non-HA).
# ===========================================================================
#
# Layers prod posture on top of ``docker-compose.yml`` (which stays the
# dev file). Used via:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Or the Makefile target that wraps the same:
#
#   make prod-up        # see Makefile + docs/deploy/single-host-prod.md
#
# What this overlay does:
#   * Adds three NEW services — ``api``, ``worker``, ``web``.
#   * Hardens the three EXISTING services — ``mysql``, ``valkey``,
#     ``vault`` — by replacing their plaintext-default secrets with
#     ``${VAR}`` interpolations sourced from ``.env.prod`` and locking
#     their host port mappings to the loopback interface.
#   * Pins every long-running service to ``restart: always`` so the
#     box rebooting brings the stack back up unattended.
#
# What this overlay does NOT do (documented limits):
#   * **Vault is still ``server -dev``.** The root token is now operator-
#     provided via ``${VAULT_ROOT_TOKEN}`` instead of the dev compose's
#     hardcoded ``dev-only-root``, but data is still in-memory. The
#     Phase 2e production-Vault cycle will swap in file storage + manual
#     unseal; see ``docs/vault-cookbook.md`` §7 for the design.
#   * **No reverse proxy.** The API binds public 443 directly, the
#     dashboard binds public 3000 directly — non-HA, single host, no
#     hostname-routing needed. An external LB / DNS layer is the
#     operator's concern.
#   * **No Prometheus/Grafana.** Phase 3a shipped ``/metrics``;
#     operators scrape from their existing observability stack.
#
# Required ``.env.prod`` shape: see ``.env.prod.example``. Compose's
# ``:?msg`` substitution is used on every secret so a missing value
# fails at ``compose up`` time with a clear error instead of silently
# defaulting to a vulnerable value.
# ===========================================================================

services:
  # -------------------------------------------------------------------------
  # MySQL — prod-shaped overrides.
  # -------------------------------------------------------------------------
  mysql:
    restart: always
    environment:
      # Operator-provided. Strong, unique per deployment. Generate with
      # `openssl rand -base64 24` or your password manager.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env.prod}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wg_manager}
      MYSQL_USER: ${MYSQL_APP_USER:-wg}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be set in .env.prod}
    # Override the dev compose's `3307:3306` (which binds 0.0.0.0) to
    # loopback-only so a misconfigured firewall doesn't expose MySQL.
    # Compose merges port lists; the override-list shape replaces the
    # entire list cleanly.
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -------------------------------------------------------------------------
  # Valkey (Celery broker) — prod-shaped overrides.
  # -------------------------------------------------------------------------
  valkey:
    restart: always
    # AUTH password is mandatory in prod. The dev compose runs without
    # auth because the docker network is on a developer's loopback;
    # production opens the broker to whatever's on the docker network.
    command:
      - "valkey-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set in .env.prod}"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Vault — prod-shaped overrides.
  #
  # Vault STILL runs in ``server -dev``: data is in-memory, so a
  # ``docker compose restart vault`` (or a host reboot) wipes state.
  # This is a documented limitation; the Phase 2e production-Vault
  # cycle is the cycle that ships file storage + manual unseal. The
  # operator-provided ${VAULT_ROOT_TOKEN} is the one prod-shaped
  # change here — at least the token isn't `dev-only-root` anymore.
  # -------------------------------------------------------------------------
  vault:
    restart: always
    environment:
      # Override the dev compose's hardcoded `dev-only-root`. The
      # operator picks this in .env.prod — strong, treat it like the
      # root password for the whole substrate.
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:?VAULT_ROOT_TOKEN must be set in .env.prod}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN}
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      # Audit log volume — keeps the Phase 2e cycle 1 vector-sidecar
      # flow working.
      - wg_manager_vault_audit_logs:/vault/logs
      # Reserved for the Phase 2e production-Vault cycle. Today the
      # mount exists but ``server -dev`` ignores it (dev mode is
      # in-memory); we mount it now so the future file-storage flip
      # doesn't have to coordinate a volume change.
      - wg_manager_vault_data:/vault/file

  # -------------------------------------------------------------------------
  # NEW: wg-manager API.
  #
  # mTLS-enforcing FastAPI server. Builds the Phase 2f Dockerfile.
  # Binds public 443 (operator-configurable via WG_MANAGER_API_BIND_ADDR
  # in case the box has multiple interfaces).
  # -------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${WG_MANAGER_IMAGE:-wg-manager:prod}
    container_name: wg_manager_api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      vault:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      # ----- Data tier connections (compose-network DNS) -----
      DATABASE_URL: mysql+pymysql://${MYSQL_APP_USER:-wg}:${MYSQL_APP_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-wg_manager}
      CELERY_BROKER_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      CELERY_RESULT_BACKEND: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN}

      # ----- All four substrate backends pinned to Vault -----
      # Phase 3d cycle 1's HA startup guard rejects ``local`` +
      # ``TLS_REQUIRED=true`` without pinned PEMs anyway. Pinning all
      # three to ``vault`` is the only honest production posture.
      CRYPTO_BACKEND: vault
      SSH_CA_BACKEND: vault
      PKI_BACKEND: vault

      # ----- mTLS listener (Phase 2d CP2) -----
      TLS_REQUIRED: "true"
      TLS_CERT_PEM: /app/tls/server.crt
      TLS_KEY_PEM: /app/tls/server.key
      TLS_CA_BUNDLE_PEM: /app/tls/ca-bundle.crt

      # ----- MySQL TLS (Phase 2d CP4.1) -----
      DATABASE_TLS_REQUIRED: "true"
      DATABASE_TLS_CA_PEM: /app/tls/mysql/ca.crt
      DATABASE_TLS_CERT_PEM: /app/tls/mysql/client.crt
      DATABASE_TLS_KEY_PEM: /app/tls/mysql/client.key

      # ----- Operator bootstrap (Phase 2d CP3.2) -----
      # CN of the first operator that the middleware self-registers
      # on its first request. Should match the CN baked into
      # tls/client.crt. Leave empty in .env.prod once the operator
      # registry has additional rows.
      AUTH_BOOTSTRAP_OPERATOR_CN: ${BOOTSTRAP_OPERATOR_CN:-}
      AUTH_BOOTSTRAP_OPERATOR_ROLE: ${BOOTSTRAP_OPERATOR_ROLE:-admin}

      # ----- Observability (Phase 3a cycle 2) -----
      OTEL_EXPORTER: ${OTEL_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-wg-manager}

      # ----- Listener -----
      BIND_HOST: 0.0.0.0
      BIND_PORT: "8000"
    volumes:
      # tls/ is operator-managed on the host; the container only reads.
      # Mint with `wg-manager certs issue` (Phase 2d CP3.3) — see the
      # bootstrap runbook for the full sequence.
      - ./tls:/app/tls:ro
    ports:
      # Public ingress for the operator API. WG_MANAGER_API_BIND_ADDR
      # defaults to 0.0.0.0 (all interfaces); operators on a multi-
      # homed box can lock to a specific NIC by setting it.
      - "${WG_MANAGER_API_BIND_ADDR:-0.0.0.0}:443:8000"
    healthcheck:
      # The /healthz probe bypasses mTLS (Phase 3d cycle 1 contract)
      # so we don't need to mount a client cert into the container's
      # own probe.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request, ssl; ctx = ssl.create_default_context(cafile='/app/tls/ca-bundle.crt'); urllib.request.urlopen('https://localhost:8000/healthz', context=ctx, timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # -------------------------------------------------------------------------
  # NEW: Celery worker.
  #
  # Same image as the api service; CMD overrides to launch celery.
  # Phase 3d cycle 2's at-least-once delivery contract + cycle 3's
  # per-row advisory locks make this safe to scale by adding replicas
  # of the worker service (omitted in non-HA — one worker only).
  # -------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${WG_MANAGER_IMAGE:-wg-manager:prod}
    container_name: wg_manager_worker
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      vault:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: ["celery", "-A", "wg_manager.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_APP_USER:-wg}:${MYSQL_APP_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-wg_manager}
      CELERY_BROKER_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      CELERY_RESULT_BACKEND: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN}
      CRYPTO_BACKEND: vault
      SSH_CA_BACKEND: vault
      PKI_BACKEND: vault
      DATABASE_TLS_REQUIRED: "true"
      DATABASE_TLS_CA_PEM: /app/tls/mysql/ca.crt
      DATABASE_TLS_CERT_PEM: /app/tls/mysql/client.crt
      DATABASE_TLS_KEY_PEM: /app/tls/mysql/client.key
      OTEL_EXPORTER: ${OTEL_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-wg-manager}
    volumes:
      - ./tls:/app/tls:ro

  # -------------------------------------------------------------------------
  # NEW: Next.js dashboard.
  #
  # Builds web/Dockerfile (Phase 2f). Binds public 3000. The BFF
  # proxy at app/api/proxy/[...path]/route.ts performs the mTLS
  # handshake server-side so the browser sees plain HTTP — the
  # dashboard's own TLS posture is the operator's external concern
  # (typically: terminate TLS at the same DNS-fronted ingress that
  # exposes this port).
  # -------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ${WG_MANAGER_WEB_IMAGE:-wg-manager-web:prod}
    container_name: wg_manager_web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      WG_MANAGER_API_UPSTREAM: https://api:8000
      # Use the same operator client cert pair the CLI uses, or mint a
      # dedicated `--type dashboard` PKCS#12 — both work here. Paths
      # are inside the container; the host-side ./tls/ bind-mount
      # makes them readable.
      WG_MANAGER_API_CLIENT_CERT: /app/tls/client.crt
      WG_MANAGER_API_CLIENT_KEY: /app/tls/client.key
      WG_MANAGER_API_CA_BUNDLE: /app/tls/ca-bundle.crt
      NODE_ENV: production
      PORT: "3100"
      HOSTNAME: 0.0.0.0
    volumes:
      - ./tls:/app/tls:ro
    ports:
      # web/Dockerfile binds 3100 internally; the host port is
      # operator-configurable. Default 3000 is the canonical Next.js
      # convention even though the container's internal port differs.
      - "${WG_MANAGER_WEB_BIND_ADDR:-0.0.0.0}:3000:3100"

# ===========================================================================
# Volume declarations — the overlay adds one new volume reserved for
# the Phase 2e production-Vault cycle.
# ===========================================================================
volumes:
  # Reserved for Vault file storage when the Phase 2e production-Vault
  # cycle swaps `server -dev` for `server -config=/vault/config/vault.hcl`.
  # Today the volume is mounted but unused (dev mode ignores it).
  # Pre-declaring lets the operator know the volume name they'll need
  # to back up once the file-storage flip lands.
  wg_manager_vault_data:
