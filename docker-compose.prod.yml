# ===========================================================================
# Production-shaped docker-compose overlay (single-host, non-HA).
# ===========================================================================
#
# Layers prod posture on top of ``docker-compose.yml`` (which stays the
# dev file). Used via:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Or the Makefile target that wraps the same:
#
#   make prod-up        # see Makefile + docs/deploy/single-host-prod.md
#
# What this overlay does:
#   * Adds three NEW services — ``api``, ``worker``, ``web``.
#   * Hardens the three EXISTING services — ``mysql``, ``valkey``,
#     ``vault`` — by replacing their plaintext-default secrets with
#     ``${VAR}`` interpolations sourced from ``.env.prod`` and locking
#     their host port mappings to the loopback interface.
#   * Pins every long-running service to ``restart: always`` so the
#     box rebooting brings the stack back up unattended.
#
# What this overlay does NOT do (documented limits):
#   * **Vault is still ``server -dev``.** The root token is now operator-
#     provided via ``${VAULT_ROOT_TOKEN}`` instead of the dev compose's
#     hardcoded ``dev-only-root``, but data is still in-memory. The
#     Phase 2e production-Vault cycle will swap in file storage + manual
#     unseal; see ``docs/vault-cookbook.md`` §7 for the design.
#   * **No reverse proxy.** The API binds public 443 directly, the
#     dashboard binds public 3000 directly — non-HA, single host, no
#     hostname-routing needed. An external LB / DNS layer is the
#     operator's concern.
#   * **No Prometheus/Grafana.** Phase 3a shipped ``/metrics``;
#     operators scrape from their existing observability stack.
#
# Required ``.env.prod`` shape: see ``.env.prod.example``. Compose's
# ``:?msg`` substitution is used on every secret so a missing value
# fails at ``compose up`` time with a clear error instead of silently
# defaulting to a vulnerable value.
# ===========================================================================

services:
  # -------------------------------------------------------------------------
  # MySQL — prod-shaped overrides.
  # -------------------------------------------------------------------------
  mysql:
    restart: always
    # `bootstrap-substrate` mints the server cert into ./tls/mysql/
    # BEFORE mysqld can start (the conf.d enforces
    # require_secure_transport=ON, which fails if the cert files are
    # missing). `service_completed_successfully` blocks startup until
    # Phase 1 exits 0.
    depends_on:
      bootstrap-substrate:
        condition: service_completed_successfully
    environment:
      # Operator-provided. Strong, unique per deployment. Generate with
      # `openssl rand -base64 24` or your password manager.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env.prod}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wg_manager}
      MYSQL_USER: ${MYSQL_APP_USER:-wg}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD must be set in .env.prod}
    # Drop the dev compose's `3307:3306` (which binds 0.0.0.0) and
    # bind loopback-only so a misconfigured firewall doesn't expose
    # MySQL. `!override` is required because Compose merges list-valued
    # keys by concatenation — without it, BOTH the dev mapping and
    # this one stay active and the second one fails to bind.
    ports: !override
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -------------------------------------------------------------------------
  # Valkey (Celery broker) — prod-shaped overrides.
  # -------------------------------------------------------------------------
  valkey:
    restart: always
    # Order valkey after Phase 1 so the prod-up boot sequence is
    # deterministic (mysql + valkey come up together once Phase 1's
    # cert mints have landed).
    depends_on:
      bootstrap-substrate:
        condition: service_completed_successfully
    # AUTH password is mandatory in prod. The dev compose runs without
    # auth because the docker network is on a developer's loopback;
    # production opens the broker to whatever's on the docker network.
    command:
      - "valkey-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${VALKEY_PASSWORD:?VALKEY_PASSWORD must be set in .env.prod}"
    # `!override` replaces the dev compose's 0.0.0.0:6379 mapping — see
    # the mysql block for the rationale.
    ports: !override
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Vault — production posture.
  #
  # Boots from docker/vault/vault.hcl (file storage backend; listener on
  # 0.0.0.0:8200; ui on; disable_mlock) instead of the dev compose's
  # `server -dev`. State persists across container restarts — the
  # rv.vpn dev-mode bug class (CA keypair regenerated on every
  # restart, breaking every host that had bootstrap-host install the
  # old CA pubkey) is gone.
  #
  # Init + unseal are automated. On first prod-up,
  # bootstrap-substrate calls `scripts/vault_init_unseal.sh` which
  # runs `vault operator init -key-shares=5 -key-threshold=3`,
  # captures the JSON output in /app/vault-init.json (mode 0600 on
  # the host — gitignored), then unseals. On every subsequent
  # prod-up the script reads the same file and re-unseals. The
  # operator backs up vault-init.json next to .env.prod; losing
  # both means losing every secret Vault holds.
  #
  # Residual gap: the unseal keys live on the operator's host
  # alongside the root token. Real production-Vault deployments
  # use cloud-KMS auto-unseal (transit/awskms/gcpckms) to keep
  # keys off-host; that requires cloud creds this work doesn't
  # assume operators have. Phase 2e Vault production cycle.
  # -------------------------------------------------------------------------
  vault:
    restart: always
    # `command` replaces the dev compose's `server -dev` form. The
    # `-config=` flag loads docker/vault/vault.hcl (bind-mounted
    # below) which sets storage + listener + ui + disable_mlock.
    #
    # `entrypoint` override is load-bearing: the official vault
    # image's docker-entrypoint.sh script mangles any command
    # starting with `server` by APPENDING
    # `-dev-listen-address="${VAULT_DEV_LISTEN_ADDRESS:-"0.0.0.0:8200"}"`
    # and `-config="$VAULT_CONFIG_DIR"` (default /vault/config).
    # In `server -dev` mode that's the whole point — Vault runs
    # in dev with the dev listener. In `server -config=...` mode
    # it makes Vault start a SECOND listener on 0.0.0.0:8200 that
    # races vault.hcl's listener and fails with "address already
    # in use", AND it passes two -config flags. Even setting
    # VAULT_DEV_LISTEN_ADDRESS="" doesn't fix it because the
    # shell `${VAR:-default}` falls back to the default on empty
    # strings.
    # Bypassing the entrypoint script and running vault directly
    # avoids the munging entirely.
    entrypoint: ["vault"]
    command: ["server", "-config=/vault/config/vault.hcl"]
    # Explicitly clear the dev-mode env keys the base compose
    # carries. Without this:
    #   * VAULT_DEV_LISTEN_ADDRESS makes Vault try to bind a SECOND
    #     listener at 0.0.0.0:8200, racing the one vault.hcl declares
    #     → "address already in use" + restart loop.
    #   * VAULT_DEV_ROOT_TOKEN_ID + VAULT_TOKEN are logged as
    #     "ignored outside dev mode" — harmless but noisy.
    # Empty string values blank-out the inherited env without removing
    # the keys (Compose has no per-key remove for env maps).
    environment:
      VAULT_DEV_LISTEN_ADDRESS: ""
      VAULT_DEV_ROOT_TOKEN_ID: ""
      VAULT_TOKEN: ""
      VAULT_ADDR: ""
    # `!override` replaces the dev compose's 0.0.0.0:8200 mapping —
    # see the mysql block for the rationale.
    ports: !override
      - "127.0.0.1:8200:8200"
    volumes:
      # The production HCL config — read-only so a compromised
      # Vault can't rewrite its own storage path or listener addr.
      - ./docker/vault/vault.hcl:/vault/config/vault.hcl:ro
      # File storage backend writes here. `wg_manager_vault_data`
      # is what carries Vault state across container restarts —
      # losing this volume means losing every secret Vault holds
      # (recoverable via `vault operator raft snapshot` if the
      # operator set up periodic snapshots; see
      # docs/runbooks/backup-restore.md).
      - wg_manager_vault_data:/vault/file
      # Audit log volume — keeps the Phase 2e cycle 1 vector-
      # sidecar flow working.
      - wg_manager_vault_audit_logs:/vault/logs
    # Override the dev compose's healthcheck. The dev version hits
    # `/v1/sys/health` which returns 501 (uninit) or 503 (sealed) —
    # both make `wget` exit non-zero, so the container reports
    # unhealthy and bootstrap-substrate's `depends_on:
    # { vault: service_healthy }` never trips. The query params
    # below make Vault return 204 for uninit / sealed instead of
    # 501 / 503, so we report healthy as soon as the listener is up.
    # The actual init + unseal happens inside bootstrap-substrate
    # (scripts/vault_init_unseal.sh) AFTER this healthcheck passes.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # -------------------------------------------------------------------------
  # Self-bootstrap Phase 1: substrate (Vault PKI / SSH CA / audit + MySQL certs).
  #
  # Runs `scripts/prod_bootstrap_substrate.sh` (committed in-tree, baked
  # into the wg-manager image). Exits 0 once the Vault substrate is
  # bootstrapped and the MySQL server + client certs are on disk in
  # tls/mysql/. MySQL + Valkey wait for this via
  # `service_completed_successfully` before they start.
  #
  # Audit-row writes for the MySQL certs fail here because MySQL isn't
  # up yet — Phase 2d CP4.3 writes the PEM files BEFORE the audit row,
  # so the files are usable even though the row write fails. The
  # script tolerates the failure explicitly and verifies the file
  # outputs exist before exiting.
  # -------------------------------------------------------------------------
  bootstrap-substrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${WG_MANAGER_IMAGE:-wg-manager:prod}
    container_name: wg_manager_bootstrap_substrate
    restart: "no"
    # Must run as root: on Linux hosts the bind-mounted ./tls is
    # owned by the operator's UID (typically 1000), but the wg-manager
    # image's non-root `wgmanager` user is UID 1001 and can't write
    # into a directory it doesn't own. (Docker Desktop on Mac papers
    # over the UID mismatch transparently — pure Linux hosts don't.)
    # The script chowns its outputs to 1001:1001 at the end so the
    # api/worker containers (running as `wgmanager`) can read them
    # read-only via their own bind-mount.
    user: "0:0"
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      # VAULT_TOKEN intentionally NOT set here. On first prod-up
      # the token doesn't exist yet — the script runs `vault
      # operator init` to generate it. On subsequent prod-ups the
      # entrypoint shim baked into the image sources the token from
      # /app/vault-init.json before exec'ing the script.
      VAULT_INIT_FILE: /app/vault-init.json
      CRYPTO_BACKEND: vault
      SSH_CA_BACKEND: vault
      PKI_BACKEND: vault
      # The cert-mint CLI tries to write an audit row to MySQL. It
      # isn't up yet; we tolerate the failure and verify file outputs
      # are present. Setting database_tls_required=false at the env
      # level keeps the CLI from spending TLS-handshake time it's
      # going to fail anyway.
      DATABASE_TLS_REQUIRED: "false"
      # Where the script reads/writes the wg-manager bootstrap
      # helpers and writes cert files. /app/tls is the host's ./tls
      # via the volume mount below.
      SCRIPT_DIR: /app/scripts
      TLS_DIR: /app/tls
      # Forward the SSH-CA role allowlists from .env.prod so an
      # operator can extend ``allowed_users`` (e.g. adding a custom
      # login account beyond the stock cloud-image users) without
      # editing the YAML. Compose's ``--env-file`` only loads values
      # for YAML interpolation; without these explicit passthroughs
      # the container sees the code defaults from
      # :class:`Settings.ssh_ca_vault_allowed_users` regardless of
      # what the operator put in .env.prod.
      #
      # The ``${VAR:-<default>}`` fallback duplicates the code
      # default (``Settings.ssh_ca_vault_allowed_users``) so an
      # operator who hasn't overridden the var still gets the
      # cloud-image account list. Same pattern as ``DEFAULT_SUBNET``
      # above. pydantic-settings treats an env var set to ``""`` as
      # "use the empty string", not "fall back to code default", so
      # ``${VAR:-}`` would silently break a fresh bootstrap — hence
      # the explicit duplication. Keep this in sync with the field
      # default in ``src/wg_manager/config.py``.
      SSH_CA_VAULT_ALLOWED_USERS: ${SSH_CA_VAULT_ALLOWED_USERS:-root,ubuntu,ec2-user,azureuser,debian,admin}
      # Empty default for ``allowed_host_domains`` matches the code
      # default and is interpreted by ``VaultSSHCA.bootstrap`` as
      # "any principal" (see the ``allowed_host_domains`` kwarg
      # discussion in ``wg_manager.ssh_ca``).
      SSH_CA_VAULT_ALLOWED_HOST_DOMAINS: ${SSH_CA_VAULT_ALLOWED_HOST_DOMAINS:-}
    volumes:
      # WRITABLE — Phase 1 mints cert files here. api/worker/web all
      # mount this same directory read-only.
      - ./tls:/app/tls
      # The bootstrap helper Python scripts (pki_bootstrap.py etc.)
      # live in the repo's scripts/ directory; the Dockerfile only
      # copies src/ + the .venv. Bind-mount scripts/ so the bootstrap
      # container has access to the helpers AND to the two
      # prod_bootstrap_*.sh entrypoints themselves.
      - ./scripts:/app/scripts:ro
      # WRITABLE — first-run `vault operator init` writes the unseal
      # keys + root token JSON here (mode 0600). Subsequent prod-ups
      # read it back to unseal Vault. Path is operator-side; back
      # up alongside .env.prod (losing both = losing every secret
      # Vault holds). Gitignored.
      - ./vault-init.json:/app/vault-init.json
    command: ["/app/scripts/prod_bootstrap_substrate.sh"]

  # -------------------------------------------------------------------------
  # Self-bootstrap Phase 2: app (migrate + register operator + mint api/cli certs).
  #
  # Runs `scripts/prod_bootstrap_app.sh`. Exits 0 once Alembic is at
  # head, the bootstrap operator is registered, and the API server +
  # operator CLI client certs are on disk in tls/. api / worker / web
  # wait for this via `service_completed_successfully`.
  # -------------------------------------------------------------------------
  bootstrap-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${WG_MANAGER_IMAGE:-wg-manager:prod}
    container_name: wg_manager_bootstrap_app
    restart: "no"
    # See bootstrap-substrate: must run as root on Linux hosts so the
    # bind-mounted ./tls is writable. End-of-script chown puts the
    # outputs back into wgmanager (1001:1001) ownership.
    user: "0:0"
    depends_on:
      bootstrap-substrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_APP_USER:-wg}:${MYSQL_APP_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-wg_manager}
      DATABASE_TLS_REQUIRED: "true"
      DATABASE_TLS_CA_PEM: /app/tls/mysql/client-ca.crt
      DATABASE_TLS_CERT_PEM: /app/tls/mysql/client.crt
      DATABASE_TLS_KEY_PEM: /app/tls/mysql/client.key
      VAULT_ADDR: http://vault:8200
      # VAULT_TOKEN is sourced by the wg-manager image's entrypoint
      # shim (docker/entrypoint-wg-manager.sh) from
      # /app/vault-init.json before exec'ing the CMD. The file is
      # bind-mounted read-only via the volumes block.
      VAULT_INIT_FILE: /app/vault-init.json
      CRYPTO_BACKEND: vault
      SSH_CA_BACKEND: vault
      PKI_BACKEND: vault
      # Operator identity. CN matches the operator's eventual mTLS
      # client cert; role is `admin` by default.
      BOOTSTRAP_OPERATOR_CN: ${BOOTSTRAP_OPERATOR_CN:?BOOTSTRAP_OPERATOR_CN must be set in .env.prod}
      BOOTSTRAP_OPERATOR_ROLE: ${BOOTSTRAP_OPERATOR_ROLE:-admin}
      # API server cert subject. Defaults cover the local-host
      # demo; production override picks the public DNS name.
      API_SERVER_CN: ${API_SERVER_CN:-localhost}
      API_SERVER_SANS: ${API_SERVER_SANS:-localhost,127.0.0.1,api}
      # WireGuard defaults — bootstrap-app runs `alembic upgrade head`,
      # and migration 0016 reads `Settings.default_subnet` AT
      # MIGRATION TIME to backfill the default tenant's
      # `subnet_pool`. Without this passthrough, the default tenant
      # gets the code default (10.9.0.0/24) on a fresh-volume boot
      # regardless of what's in .env.prod — the exact symptom rv.vpn
      # reported after PR #50.
      DEFAULT_SUBNET: ${DEFAULT_SUBNET:-10.9.0.0/24}
      DEFAULT_WG_PORT: ${DEFAULT_WG_PORT:-51820}
      TLS_DIR: /app/tls
    volumes:
      - ./tls:/app/tls
      - ./scripts:/app/scripts:ro
      # Alembic needs the alembic.ini + versions/ directory at runtime
      # to locate migrations. The Phase 2f Dockerfile bakes src/ +
      # .venv but not the alembic tree (which lives at the repo root);
      # bind-mount it read-only so `alembic upgrade head` finds the
      # versions/ files. Read-only because Phase 2 doesn't write to
      # alembic state.
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
      # Read-only — the entrypoint shim sources VAULT_TOKEN from this
      # file. bootstrap-substrate is the only writer.
      - ./vault-init.json:/app/vault-init.json:ro
    command: ["/app/scripts/prod_bootstrap_app.sh"]

  # -------------------------------------------------------------------------
  # NEW: wg-manager API.
  #
  # mTLS-enforcing FastAPI server. Builds the Phase 2f Dockerfile.
  # Binds public 443 (operator-configurable via WG_MANAGER_API_BIND_ADDR
  # in case the box has multiple interfaces).
  # -------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${WG_MANAGER_IMAGE:-wg-manager:prod}
    container_name: wg_manager_api
    restart: always
    # Phase 2 (`bootstrap-app`) is what mints the API server cert
    # uvicorn loads at bind time + applies migrations the API needs to
    # serve traffic. Waiting on `service_completed_successfully` means
    # `make prod-up` blocks until bootstrap is genuinely done.
    depends_on:
      bootstrap-app:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      vault:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      # ----- Data tier connections (compose-network DNS) -----
      DATABASE_URL: mysql+pymysql://${MYSQL_APP_USER:-wg}:${MYSQL_APP_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-wg_manager}
      CELERY_BROKER_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      CELERY_RESULT_BACKEND: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      VAULT_ADDR: http://vault:8200
      # VAULT_TOKEN is sourced by the wg-manager image's entrypoint
      # shim (docker/entrypoint-wg-manager.sh) from
      # /app/vault-init.json before exec'ing the CMD. The file is
      # bind-mounted read-only via the volumes block.
      VAULT_INIT_FILE: /app/vault-init.json

      # ----- All four substrate backends pinned to Vault -----
      # Phase 3d cycle 1's HA startup guard rejects ``local`` +
      # ``TLS_REQUIRED=true`` without pinned PEMs anyway. Pinning all
      # three to ``vault`` is the only honest production posture.
      CRYPTO_BACKEND: vault
      SSH_CA_BACKEND: vault
      PKI_BACKEND: vault

      # ----- mTLS listener (Phase 2d CP2) -----
      TLS_REQUIRED: "true"
      TLS_CERT_PEM: /app/tls/server.crt
      TLS_KEY_PEM: /app/tls/server.key
      TLS_CA_BUNDLE_PEM: /app/tls/ca-bundle.crt

      # ----- MySQL TLS (Phase 2d CP4.1) -----
      DATABASE_TLS_REQUIRED: "true"
      DATABASE_TLS_CA_PEM: /app/tls/mysql/ca.crt
      DATABASE_TLS_CERT_PEM: /app/tls/mysql/client.crt
      DATABASE_TLS_KEY_PEM: /app/tls/mysql/client.key

      # ----- Operator bootstrap (Phase 2d CP3.2) -----
      # CN of the first operator that the middleware self-registers
      # on its first request. Should match the CN baked into
      # tls/client.crt. Leave empty in .env.prod once the operator
      # registry has additional rows.
      AUTH_BOOTSTRAP_OPERATOR_CN: ${BOOTSTRAP_OPERATOR_CN:-}
      AUTH_BOOTSTRAP_OPERATOR_ROLE: ${BOOTSTRAP_OPERATOR_ROLE:-admin}

      # ----- Observability (Phase 3a cycle 2) -----
      OTEL_EXPORTER: ${OTEL_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-wg-manager}

      # ----- Listener -----
      BIND_HOST: 0.0.0.0
      BIND_PORT: "8000"

      # ----- WireGuard defaults -----
      # CIDR a `POST /servers` payload inherits when `subnet` is
      # omitted. Picked by the dashboard's "New server" form as the
      # pre-filled value. Defaults to the code default 10.9.0.0/24;
      # override in .env.prod.
      DEFAULT_SUBNET: ${DEFAULT_SUBNET:-10.9.0.0/24}
      # UDP port a `POST /servers` payload inherits when
      # `wg_port` is omitted. Operators running multiple wg-manager
      # stacks on overlapping VPN address space will want distinct
      # ports per stack.
      DEFAULT_WG_PORT: ${DEFAULT_WG_PORT:-51820}
    volumes:
      # tls/ is operator-managed on the host; the container only reads.
      # Mint with `wg-manager certs issue` (Phase 2d CP3.3) — see the
      # bootstrap runbook for the full sequence.
      - ./tls:/app/tls:ro
      # Read-only — the entrypoint shim sources VAULT_TOKEN from this
      # file. bootstrap-substrate is the only writer.
      - ./vault-init.json:/app/vault-init.json:ro
    ports:
      # Public ingress for the operator API. `WG_MANAGER_API_BIND_ADDR`
      # defaults to 0.0.0.0 (all interfaces); operators on a multi-
      # homed box can lock to a specific NIC by setting it.
      # `WG_MANAGER_API_BIND_PORT` defaults to 443; operators running
      # multiple stacks on one host (or behind a fronting reverse
      # proxy that owns 443) can override.
      - "${WG_MANAGER_API_BIND_ADDR:-0.0.0.0}:${WG_MANAGER_API_BIND_PORT:-443}:8000"
    healthcheck:
      # NOTE: Phase 3d cycle 1's doc contract says ``/healthz`` bypasses
      # mTLS, but the implementation's bypass is at the app layer only.
      # uvicorn is configured with ``ssl.CERT_REQUIRED`` whenever
      # ``TLS_REQUIRED=true``, so the TLS handshake still demands a
      # client cert — meaning a cert-less probe is dropped before the
      # app's exemption can fire. The probe therefore presents the
      # operator client cert; the ``./tls`` bind-mount already makes
      # it available inside the container. See the open-issue list
      # for the code-side cycle that closes this doc-vs-implementation
      # gap.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request, ssl; ctx = ssl.create_default_context(cafile='/app/tls/ca-bundle.crt'); ctx.load_cert_chain(certfile='/app/tls/client.crt', keyfile='/app/tls/client.key'); urllib.request.urlopen('https://localhost:8000/healthz', context=ctx, timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # -------------------------------------------------------------------------
  # NEW: Celery worker.
  #
  # Same image as the api service; CMD overrides to launch celery.
  # Phase 3d cycle 2's at-least-once delivery contract + cycle 3's
  # per-row advisory locks make this safe to scale by adding replicas
  # of the worker service (omitted in non-HA — one worker only).
  # -------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${WG_MANAGER_IMAGE:-wg-manager:prod}
    container_name: wg_manager_worker
    restart: always
    depends_on:
      bootstrap-app:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      vault:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: ["celery", "-A", "wg_manager.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_APP_USER:-wg}:${MYSQL_APP_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-wg_manager}
      CELERY_BROKER_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      CELERY_RESULT_BACKEND: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      VAULT_ADDR: http://vault:8200
      # VAULT_TOKEN is sourced by the wg-manager image's entrypoint
      # shim (docker/entrypoint-wg-manager.sh) from
      # /app/vault-init.json before exec'ing the CMD. The file is
      # bind-mounted read-only via the volumes block.
      VAULT_INIT_FILE: /app/vault-init.json
      CRYPTO_BACKEND: vault
      SSH_CA_BACKEND: vault
      PKI_BACKEND: vault
      DATABASE_TLS_REQUIRED: "true"
      DATABASE_TLS_CA_PEM: /app/tls/mysql/ca.crt
      DATABASE_TLS_CERT_PEM: /app/tls/mysql/client.crt
      DATABASE_TLS_KEY_PEM: /app/tls/mysql/client.key
      OTEL_EXPORTER: ${OTEL_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-wg-manager}
      # WireGuard defaults — same passthrough as the api service so
      # provisioning tasks see the operator's overrides.
      DEFAULT_SUBNET: ${DEFAULT_SUBNET:-10.9.0.0/24}
      DEFAULT_WG_PORT: ${DEFAULT_WG_PORT:-51820}
    volumes:
      - ./tls:/app/tls:ro
      # Read-only — the entrypoint shim sources VAULT_TOKEN from this
      # file. bootstrap-substrate is the only writer.
      - ./vault-init.json:/app/vault-init.json:ro

  # -------------------------------------------------------------------------
  # NEW: Next.js dashboard.
  #
  # Builds web/Dockerfile (Phase 2f). Binds public 3000. The BFF
  # proxy at app/api/proxy/[...path]/route.ts performs the mTLS
  # handshake server-side so the browser sees plain HTTP — the
  # dashboard's own TLS posture is the operator's external concern
  # (typically: terminate TLS at the same DNS-fronted ingress that
  # exposes this port).
  # -------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ${WG_MANAGER_WEB_IMAGE:-wg-manager-web:prod}
    container_name: wg_manager_web
    restart: always
    depends_on:
      bootstrap-app:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      WG_MANAGER_API_UPSTREAM: https://api:8000
      # Use the same operator client cert pair the CLI uses, or mint a
      # dedicated `--type dashboard` PKCS#12 — both work here. Paths
      # are inside the container; the host-side ./tls/ bind-mount
      # makes them readable.
      WG_MANAGER_API_CLIENT_CERT: /app/tls/client.crt
      WG_MANAGER_API_CLIENT_KEY: /app/tls/client.key
      WG_MANAGER_API_CA_BUNDLE: /app/tls/ca-bundle.crt
      NODE_ENV: production
      PORT: "3100"
      HOSTNAME: 0.0.0.0
    volumes:
      - ./tls:/app/tls:ro
    ports:
      # web/Dockerfile binds 3100 internally; the host port is
      # operator-configurable. Default 3000 is the canonical Next.js
      # convention even though the container's internal port differs.
      # `WG_MANAGER_WEB_BIND_PORT` lets operators running multiple
      # stacks on one host pick a different host port.
      - "${WG_MANAGER_WEB_BIND_ADDR:-0.0.0.0}:${WG_MANAGER_WEB_BIND_PORT:-3000}:3100"

# ===========================================================================
# Volume declarations — the overlay adds one new volume reserved for
# the Phase 2e production-Vault cycle.
# ===========================================================================
volumes:
  # Reserved for Vault file storage when the Phase 2e production-Vault
  # cycle swaps `server -dev` for `server -config=/vault/config/vault.hcl`.
  # Today the volume is mounted but unused (dev mode ignores it).
  # Pre-declaring lets the operator know the volume name they'll need
  # to back up once the file-storage flip lands.
  wg_manager_vault_data:
