# Prometheus alerting rules for wg-manager (Phase 3a cycle 3).
#
# Drop this file into your Prometheus config's ``rule_files:`` list:
#
#   # prometheus.yml
#   rule_files:
#     - /etc/prometheus/wg-manager-alerts.yaml
#
# Rules covering the most operationally-meaningful failure
# modes a v0.1.0 wg-manager deployment can hit:
#
#   * Wg5xxSurge          — 5xx-rate climbs (almost always a backend
#                           dependency degradation, not a bug)
#   * WgVaultLatencyHigh  — Vault round-trip p95 > 2s (Vault is the
#                           critical-path bottleneck; cert renewal,
#                           provisioning, and encrypted backups all
#                           wait on it)
#   * WgCertExpiringSoon  — a non-revoked cert is within 7 days of
#                           expiry; the cert-renew systemd timer
#                           should have caught it (see
#                           docs/deploy/systemd-timer.md), so this
#                           firing means the timer skipped
#   * WgHostCertRotationFailing — an SSH host cert is < 8h from
#                           expiry, so the hourly rotation sweep
#                           keeps failing for that host
#   * WgHostCertExpired   — an SSH host cert has expired; the host
#                           needs a manual in-stack bootstrap-host
#
# A second group, wg-manager.enrollment (Phase 3f), watches the
# zero-touch enrollment listener's counters:
#
#   * WgEnrollTokenGuessing — many unknown-token rejections: someone
#                             is guessing, or a fleet has a stale token
#   * WgEnrollDeadTokens    — hosts presenting expired / used-up
#                             tokens: boots slower than the TTL, or an
#                             autoscaling group larger than max_uses
#   * WgEnrollMetricsDown   — the counters can't be read, so the two
#                             alerts above can't fire
#
# Tune ``for:`` durations to your deployment's pain tolerance. The
# defaults are conservative: short enough to catch incidents,
# long enough that a transient blip doesn't page on-call.

groups:
  - name: wg-manager.observability
    interval: 30s
    rules:
      # ----- HTTP -------------------------------------------------
      - alert: Wg5xxSurge
        # Fires when the rolling 5xx fraction over the last 5 minutes
        # is above 5% of total request rate. Stays in pending for 5m
        # to absorb transient blips; pages after that.
        expr: |
          (
            sum(rate(wg_manager_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(wg_manager_http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "wg-manager 5xx rate above 5% (5m)"
          description: |
            More than 5% of wg-manager HTTP responses over the last
            5 minutes returned 5xx. Check the Backend (pytest) log
            stream and the recent Vault round-trip latency panel on
            the service-health Grafana dashboard — most 5xx
            incidents originate downstream.
          runbook: docs/observability.md#alerting-recipes

      # ----- Vault ------------------------------------------------
      - alert: WgVaultLatencyHigh
        # Vault round-trip p95 has stayed above 2s for 5m. Most
        # commonly: Vault is sealed (likely a recent restart), the
        # network between wg-manager and Vault has degraded, or
        # Vault is under-provisioned for its load. The vault-down
        # runbook walks every recovery branch.
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, engine) (
              rate(wg_manager_vault_request_duration_seconds_bucket[5m])
            )
          ) > 2
        for: 5m
        labels:
          severity: warning
          component: vault
        annotations:
          summary: "Vault round-trip p95 above 2s for 5m ({{ $labels.engine }})"
          description: |
            The 95th percentile of wg-manager's Vault round-trip
            durations has stayed above 2 seconds for the last 5
            minutes against engine ``{{ $labels.engine }}``. This
            is upstream of every provisioning task, cert issue/
            renew, and encrypted backup — degraded Vault means
            degraded wg-manager.
          runbook: docs/runbooks/vault-down.md

      # ----- Cert lifecycle --------------------------------------
      - alert: WgCertExpiringSoon
        # A non-revoked cert is within 7 days of expiry. The
        # cert-renew systemd timer (docs/deploy/systemd-timer.md)
        # should have caught this — if it's firing, the timer
        # skipped, or the cert was issued via POST /certs (no
        # ``out_*_path``) so the walker skips it. Re-issue via the
        # CLI to opt into automated renewal.
        expr: (wg_manager_cert_not_after_seconds - time()) < 7 * 86400
        for: 30m
        labels:
          severity: warning
          component: certs
        annotations:
          summary: "Cert {{ $labels.cn }} ({{ $labels.cert_type }}) expires in < 7d"
          description: |
            The cert with serial={{ $labels.serial }} CN={{ $labels.cn
            }} ({{ $labels.cert_type }}) is non-revoked and will
            expire within 7 days. The cert-renew walker normally
            handles this 50% of the way into the cert's lifetime —
            check the cert-renew systemd timer status and re-run
            ``wg-manager certs renew --due`` against the host
            running it. Rows issued via POST /certs (no out_*_path)
            are skipped by the walker — re-issue with
            ``wg-manager certs issue --out-cert/...`` to opt into
            automated renewal.
          runbook: docs/deploy/systemd-timer.md

      # ----- SSH host certs ---------------------------------------
      - alert: WgHostCertRotationFailing
        # Beat renews every host cert 12h before expiry
        # (SSH_HOST_CERT_RENEW_BEFORE_SECONDS) and retries hourly
        # (SSH_HOST_CERT_ROTATION_INTERVAL_SECONDS). Under 8h left
        # means at least four sweeps failed for this host, or beat /
        # the worker isn't running. Scale the threshold if you change
        # either setting.
        expr: (wg_manager_host_cert_valid_before_seconds - time()) < 8 * 3600
        for: 15m
        labels:
          severity: warning
          component: ssh
        annotations:
          summary: "Host cert for {{ $labels.kind }} {{ $labels.name }} not renewing (< 8h left)"
          description: |
            The SSH host cert on {{ $labels.kind }} {{ $labels.id }}
            ({{ $labels.hostname }}) expires in under 8 hours and the
            hourly rotation hasn't renewed it. Look for
            ``host-cert rotation failed`` in the worker logs, check
            that beat and the worker are running, then rotate it with
            ``POST /{{ $labels.kind }}s/{{ $labels.id }}/rotate-host-cert``.
            Once it expires, it can only be recovered by hand.
          runbook: docs/deploy/single-host-prod.md#automatic-host-cert-renewal

      - alert: WgHostCertExpired
        # Past expiry the worker rejects the host's cert, so rotation,
        # reconfigure and discovery all fail until an operator
        # re-bootstraps it.
        expr: wg_manager_host_cert_valid_before_seconds < time()
        for: 5m
        labels:
          severity: critical
          component: ssh
        annotations:
          summary: "Host cert for {{ $labels.kind }} {{ $labels.name }} has expired"
          description: |
            The SSH host cert on {{ $labels.kind }} {{ $labels.id }}
            ({{ $labels.hostname }}) has expired. wg-manager can't
            reach the host until it's re-bootstrapped: run
            ``bootstrap-host`` inside the stack (Path B) with the
            host's out-of-band SSH key and its recorded
            ``ssh_username``, then rotate the row.
          runbook: docs/deploy/single-host-prod.md#path-b--cli-for-scripted--ci-use

  # ===================================================================
  # Warm standby (Phase 3d cycle 5e).
  #
  # The standby runs no API, so these metrics come from a node_exporter
  # textfile-collector file written every minute by `make standby-metrics`
  # (docs/observability.md → Warm standby). They're timestamps, not ages,
  # so `time() - x` keeps growing even if that timer dies.
  #
  # No rule uses absent(): a single-host install has no standby series at
  # all and must stay quiet. Losing node_exporter itself makes every
  # series go stale (nothing here fires), so keep your usual
  # `up{job="node"} == 0` alert for the standby host.
  #
  # promtool unit tests: prometheus-alerts.test.yaml (`make alerts-check`).
  # ===================================================================
  - name: wg-manager.standby
    interval: 1m
    rules:
      - alert: WgStandbyReplicationBroken
        # A failover from here would lose everything since the break.
        expr: >-
          wg_manager_standby_replication_io_running == 0
          or wg_manager_standby_replication_sql_running == 0
        for: 5m
        labels:
          severity: critical
          component: standby
        annotations:
          summary: "Standby {{ $labels.instance }}: MySQL replication is not running"
          description: |
            The warm standby's MySQL replica on {{ $labels.instance }} is not
            replicating. Run `make standby-status` there: Last_IO_Error /
            Last_SQL_Error say why (primary down or unreachable, an expired
            certificate, a diverged replica that needs re-seeding).
          runbook: docs/runbooks/standby-replication.md#troubleshooting

      - alert: WgStandbyReplicationLagging
        expr: wg_manager_standby_replication_lag_seconds > 300
        for: 10m
        labels:
          severity: warning
          component: standby
        annotations:
          summary: "Standby {{ $labels.instance }}: replica {{ $value }}s behind"
          description: |
            The replica on {{ $labels.instance }} is more than 5 minutes
            behind the primary. A failover now would lose that window.
            Check the standby's disk and CPU and the link to the primary.
          runbook: docs/runbooks/standby-replication.md#day-2

      - alert: WgStandbyBundleStale
        # No bundle at all, or the last one is over an hour old: the
        # standby's Vault (and tls/, .env.prod) would be that old on
        # failover.
        expr: >-
          wg_manager_standby_bundle_present == 0
          or (time() - wg_manager_standby_bundle_created_timestamp_seconds) > 3600
        for: 15m
        labels:
          severity: warning
          component: standby
        annotations:
          summary: "Standby {{ $labels.instance }}: Vault bundle from the primary is stale"
          description: |
            The standby hasn't installed a fresh bundle from the primary in
            over an hour. Check `systemctl status wg-manager-standby-pull.timer`
            and `journalctl -u wg-manager-standby-pull` on {{ $labels.instance }}.
          runbook: docs/runbooks/standby-replication.md#troubleshooting

      - alert: WgStandbyCodeDrift
        expr: wg_manager_standby_bundle_commit_drift == 1
        for: 1h
        labels:
          severity: warning
          component: standby
        annotations:
          summary: "Standby {{ $labels.instance }} runs a different commit than the primary"
          description: |
            A failover would run different code than the primary. Check out
            the primary's commit on {{ $labels.instance }} (`make standby-status`
            shows both), then `make standby-up` to rebuild its image.
          runbook: docs/runbooks/standby-replication.md#day-2

      - alert: WgStandbyMetricsStale
        # The standby-metrics timer stopped; every other standby alert is
        # blind until it runs again.
        expr: (time() - wg_manager_standby_metrics_generated_timestamp_seconds) > 600
        for: 5m
        labels:
          severity: warning
          component: standby
        annotations:
          summary: "Standby {{ $labels.instance }}: metrics not refreshed for 10m"
          description: |
            `make standby-metrics` hasn't run on {{ $labels.instance }} for
            over 10 minutes, so the other standby alerts can't see it. Check
            `systemctl status wg-manager-standby-metrics.timer`.
          runbook: docs/deploy/systemd-timer.md#warm-standby-metrics-and-drill-phase-3d-cycle-5e

      - alert: WgStandbyDrillFailed
        # The most recent drill failed: a real failover would probably
        # fail the same way.
        expr: >-
          wg_manager_standby_drill_last_failure_timestamp_seconds
            > on(instance) wg_manager_standby_drill_last_success_timestamp_seconds
          or (wg_manager_standby_drill_last_failure_timestamp_seconds
            unless on(instance) wg_manager_standby_drill_last_success_timestamp_seconds)
        for: 1m
        labels:
          severity: warning
          component: standby
        annotations:
          summary: "Standby {{ $labels.instance }}: the failover drill failed"
          description: |
            The last `make standby-drill` on {{ $labels.instance }} failed, so
            a real failover would likely fail too. Run it by hand and read
            the output: `journalctl -u wg-manager-standby-drill`.
          runbook: docs/runbooks/failover.md#the-weekly-drill

      - alert: WgStandbyDrillOverdue
        # No successful drill in 8 days (the timer is weekly), or a
        # standby that reports metrics but has never drilled.
        expr: >-
          (time() - wg_manager_standby_drill_last_success_timestamp_seconds) > 8 * 86400
          or (wg_manager_standby_metrics_generated_timestamp_seconds
            unless on(instance) wg_manager_standby_drill_last_success_timestamp_seconds)
        for: 1h
        labels:
          severity: warning
          component: standby
        annotations:
          summary: "Standby {{ $labels.instance }}: no successful failover drill in 8 days"
          description: |
            Nothing has proven the standby on {{ $labels.instance }} can take
            over for over a week. Check `systemctl status
            wg-manager-standby-drill.timer`, or run `make standby-drill` once.
          runbook: docs/runbooks/failover.md#the-weekly-drill

  - name: wg-manager.enrollment
    interval: 30s
    rules:
      - alert: WgEnrollTokenGuessing
        # Unknown tokens are what a guesser produces (a real token is
        # 256 bits, so guessing won't succeed, but it's worth knowing).
        # The per-IP lockout stops one source after 10 in 10 min, so
        # more than 20 across the fleet means several sources, or a
        # fleet whose userdata carries a token that was never minted.
        expr: sum(increase(wg_manager_enroll_rejects_total{reason="unknown_token"}[10m])) > 20
        for: 5m
        labels:
          severity: warning
          component: enroll
        annotations:
          summary: "Enrollment: {{ $value | humanize }} unknown-token rejections in 10m"
          description: |
            POST /v1/enroll rejected more than 20 unknown tokens in the
            last 10 minutes. Check the `enroll.reject` audit lines
            (reason=unknown_token) for the peers. Many peers: someone
            is probing the enroll port; consider restricting it at the
            firewall / LB. One NAT address: likely your own hosts with
            a mistyped or never-minted token in their userdata.
          runbook: docs/operator-guide.md#enrollment-metrics-and-alerts

      - alert: WgEnrollDeadTokens
        # A host presented a real token that has expired or has no uses
        # left. That's almost never an attack: a boot took longer than
        # ttl_seconds, or more instances launched than max_uses.
        expr: sum by (reason) (increase(wg_manager_enroll_rejects_total{reason=~"expired|exhausted"}[15m])) > 0
        for: 0m
        labels:
          severity: warning
          component: enroll
        annotations:
          summary: "Enrollment: hosts presenting {{ $labels.reason }} tokens"
          description: |
            At least one host failed to enroll in the last 15 minutes
            with an {{ $labels.reason }} token, so it booted but isn't
            on the VPN. expired: raise ttl_seconds or mint closer to
            launch. exhausted: the group launched more instances than
            max_uses. Mint a new token and re-run the userdata, or
            replace the instance.
          runbook: docs/operator-guide.md#enrollment-metrics-and-alerts

      - alert: WgEnrollMetricsDown
        # The operator API couldn't read the enrollment counters from
        # Valkey. Enrollment itself is probably failing too (the rate
        # limiter uses the same store and fails closed).
        expr: wg_manager_enroll_metrics_up == 0
        for: 10m
        labels:
          severity: warning
          component: enroll
        annotations:
          summary: "Enrollment metrics unreadable for 10m"
          description: |
            wg_manager_enroll_metrics_up has been 0 for 10 minutes: the
            API can't read the enrollment counters from Valkey, so the
            other enrollment alerts can't fire. Enrollment requests are
            likely getting 503 too, because the rate limiter shares the
            store and fails closed. Check Valkey and the API's
            connection to it.
          runbook: docs/operator-guide.md#enrollment-metrics-and-alerts
