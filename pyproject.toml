[project]
name = "wg-manager"
version = "0.1.0"
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.48.0",
    "sqlmodel>=0.0.22",
    "pymysql>=1.1.0",
    "cryptography>=43.0.0",
    "pydantic-settings>=2.5.0",
    "paramiko>=5.0.0",
    "python-dotenv>=1.0.1",
    "celery>=5.4.0",
    "redis>=8.0.0",
    "celery-types>=0.26.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    # hvac drives wg_manager.crypto's Vault Transit backend (Phase 2b).
    # The LocalDevBackend path doesn't call into hvac, but the import
    # happens at module load — so this is runtime, not dev.
    "hvac>=2.3.0",
]

[project.scripts]
wg-manager = "wg_manager.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "alembic>=1.13.0",
    # Phase 2d CP4.2: ``tests/test_mysql_tls_config.py`` parses
    # ``docker-compose.yml`` to pin the MySQL service's TLS-cert + my.cnf
    # mounts. PyYAML is the de-facto stdlib YAML parser for Python; it
    # only needs to be present at test-time.
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wg_manager"]

[tool.bandit]
# Phase 2e CI gate config. ``make bandit`` and the CI workflow both
# read this section via ``bandit -c pyproject.toml``.
#
# B601 (paramiko_calls) — every paramiko.exec_command() call trips this
# rule. ``ssh.py`` and ``bootstrap_ssh.py`` ARE the SSH execution layer;
# the rule has nothing to add. The audit boundary that actually matters
# is ``tasks.py`` (which builds the command strings); that lives in a
# separate review pass, not in a wholesale per-call mark-up. Keeping
# B601 enabled would burn the gate's signal-to-noise with ~6 known-safe
# markers across two files.
#
# B507 (ssh_no_host_key_verification) is intentionally NOT skipped — it
# catches genuine ``AutoAddPolicy`` regressions. The two known-safe
# sites carry per-line ``# nosec B507`` with a rationale.
skips = ["B601"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Phase 2c CP5 introduces the ``e2e`` marker for the dockerised-sshd
# acceptance suite under ``tests/e2e/``. Phase 2d CP5 introduces a
# second marker ``e2e_tls`` for the mTLS acceptance bucket under
# ``tests/e2e/tls/`` — separate because the two buckets have
# different prereqs (the sshd suite needs Vault + the sshd container;
# the TLS suite is in-process LocalDevPKI plus a uvicorn subprocess).
# The default invocation (``make test``) deselects *both* so the fast
# suite stays hermetic; ``make test-e2e`` / ``make test-e2e-tls``
# opt in explicitly. Tests in each bucket get their marker
# auto-applied via the relevant conftest hook so individual test
# files don't need to repeat ``@pytest.mark.…`` on every function.
markers = [
    "e2e: end-to-end acceptance tests that require a live dockerised sshd + Vault dev (Phase 2c CP5)",
    "e2e_tls: mTLS acceptance tests that spin a live uvicorn + LocalDevPKI subprocess (Phase 2d CP5)",
]
addopts = "-m 'not e2e and not e2e_tls'"
