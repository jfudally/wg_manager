[project]
name = "wg-manager"
version = "0.1.0"
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "pymysql>=1.1.0",
    "cryptography>=43.0.0",
    "pydantic-settings>=2.5.0",
    "paramiko>=3.5.0",
    "python-dotenv>=1.0.1",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "celery-types>=0.26.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    # hvac drives wg_manager.crypto's Vault Transit backend (Phase 2b).
    # The LocalDevBackend path doesn't call into hvac, but the import
    # happens at module load — so this is runtime, not dev.
    "hvac>=2.3.0",
]

[project.scripts]
wg-manager = "wg_manager.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "alembic>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wg_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
