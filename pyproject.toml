[project]
name = "wg-manager"
version = "0.1.0"
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "pymysql>=1.1.0",
    "cryptography>=43.0.0",
    "pydantic-settings>=2.5.0",
    "paramiko>=3.5.0",
    "python-dotenv>=1.0.1",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "celery-types>=0.26.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    # hvac drives wg_manager.crypto's Vault Transit backend (Phase 2b).
    # The LocalDevBackend path doesn't call into hvac, but the import
    # happens at module load — so this is runtime, not dev.
    "hvac>=2.3.0",
]

[project.scripts]
wg-manager = "wg_manager.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "alembic>=1.13.0",
    # Phase 2d CP4.2: ``tests/test_mysql_tls_config.py`` parses
    # ``docker-compose.yml`` to pin the MySQL service's TLS-cert + my.cnf
    # mounts. PyYAML is the de-facto stdlib YAML parser for Python; it
    # only needs to be present at test-time.
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wg_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Phase 2c CP5 introduces the ``e2e`` marker for the dockerised-sshd
# acceptance suite under ``tests/e2e/``. The default invocation
# (``make test``) deselects ``e2e`` so the fast suite stays hermetic
# and free of docker / Vault dependencies; ``make test-e2e`` opts in
# explicitly. Tests in the e2e bucket get the marker auto-applied via
# the ``tests/e2e/conftest.py`` hook so individual test files don't
# need to repeat ``@pytest.mark.e2e`` on every function.
markers = [
    "e2e: end-to-end acceptance tests that require a live dockerised sshd + Vault dev (Phase 2c CP5)",
]
addopts = "-m 'not e2e'"
