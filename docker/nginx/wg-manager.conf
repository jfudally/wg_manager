# Phase 3d cycle 4a — nginx LB config for the docker-compose `ha`
# profile.
#
# Routes mTLS connections from the host's 127.0.0.1:8443 ingress port
# to the two API replicas (api1:8000, api2:8000) WITHOUT terminating
# TLS at this layer. Phase 3f hardening adds a second port,
# 127.0.0.1:8444, for zero-touch enrollment: the same passthrough to the
# enroll1 / enroll2 listeners, plus PROXY protocol (see the block below). The HA topology in
# docs/deploy/ha-control-plane.md requires that the operator's mTLS
# handshake land on the wg-manager replica intact — terminating here
# would force wg-manager to trust whatever subject the LB inserted,
# breaking Phase 2d's "operator cert == operator identity" contract.
#
# Why `stream {}` and not `http {}`:
#   stream {} = L4 TCP passthrough. nginx forwards opaque bytes; the
#               TLS handshake completes between the client and the
#               upstream replica. ✔ Compatible with the HA topology.
#   http   {} = L7 HTTP proxy. nginx would have to terminate TLS to
#               read the request line, which is exactly what the HA
#               topology forbids.
#
# Why passive health checks (max_fails + fail_timeout) and not
# active /readyz probing:
#   Active HTTPS probing from the stream module requires nginx-plus.
#   Cycle 4a's local-dev demo uses passive checks — a flapping
#   replica gets pulled from rotation after N connect failures. A
#   production deployment that needs active probing can run an
#   external probe sidecar that toggles upstream `down` markers via
#   the nginx OSS dynamic-modules ecosystem, or upgrade to nginx-plus.

# `events {}` is mandatory — nginx refuses to start without it even
# if the only configured block is `stream {}`.
events {
    worker_connections 1024;
}

stream {
    # The single upstream the ingress port forwards to. Round-robin
    # by default; `weight=` could be added if the operator wanted
    # asymmetric replica capacities. `max_fails=3 fail_timeout=10s`
    # means a replica is taken out of rotation after 3 connect
    # failures within 10s, and re-tried after 10s.
    upstream wg_manager_api {
        server api1:8000 max_fails=3 fail_timeout=10s;
        server api2:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        # Lines up with docker-compose.yml's `lb.ports:
        # 127.0.0.1:8443:8443` mapping. If this port changes, the
        # compose file must change in lockstep; the
        # `tests/test_nginx_lb_config.py::test_listens_on_8443`
        # assertion trips loudly otherwise.
        listen 8443;
        proxy_pass wg_manager_api;
        # Connect timeout = how long to wait for an upstream replica
        # to accept the TCP connection before failing over. Five
        # seconds is short enough that a hung replica doesn't hold up
        # a real operator request; long enough that a momentarily
        # busy replica isn't penalised.
        proxy_connect_timeout 5s;
        # Idle-timeout. The mTLS-authenticated API call can be long
        # (provision tasks return quickly via Celery delegation, but
        # the synchronous /healthz / /readyz probes also flow
        # through this listener and don't need more than a second).
        # 60s is comfortable for either shape.
        proxy_timeout 60s;
    }

    # Phase 3f: the enrollment listeners (python -m
    # wg_manager.enroll_listener). Same passive health checks as the API.
    upstream wg_manager_enroll {
        server enroll1:8001 max_fails=3 fail_timeout=10s;
        server enroll2:8001 max_fails=3 fail_timeout=10s;
    }

    server {
        # Lines up with docker-compose.yml's `lb.ports:
        # 127.0.0.1:8444:8444`.
        listen 8444;
        proxy_pass wg_manager_enroll;
        # Prepend a PROXY v1 header naming the real client. Still L4
        # passthrough: the header goes before the client's TLS bytes,
        # and the enroll listener (ENROLL_PROXY_PROTOCOL=true) reads it
        # before the handshake. Without it every host would share
        # nginx's address in the per-IP rate limiter, and one attacker's
        # bad tokens would lock out every enrollment.
        #
        # Enroll port ONLY: the operator listener doesn't parse PROXY
        # headers, so sending one there would break every mTLS
        # handshake (tests/test_nginx_lb_config.py pins this).
        proxy_protocol on;
        proxy_connect_timeout 5s;
        # Redemption is one short request (allocate + sign), well
        # under this.
        proxy_timeout 60s;
    }
}
