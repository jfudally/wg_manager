# Phase 2e CI baseline — runs the fast test suite on every push and PR
# against ``main``. Security gates (gitleaks, pip-audit, npm audit, bandit,
# semgrep) ship in subsequent cycles as their own workflows / jobs so
# failures bisect to a single gate.
#
# The Phase 2c CP5 / 2d CP5 e2e buckets stay out of this workflow on
# purpose — they need a dockerised sshd / live ``uvicorn`` subprocess
# and longer wall-clock. The fast suite (``-m 'not e2e and not e2e_tls'``
# from ``pyproject.toml`` addopts) is what guards every PR.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies (incl. dev)
        run: uv sync --extra dev --frozen

      - name: Run fast test suite
        run: uv run --frozen pytest -q

  # Ruff lint gate. Calls ``make lint`` rather than ruff directly so CI
  # and local runs can't drift; ruff itself is pinned in the dev extra.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies (incl. dev)
        run: uv sync --extra dev --frozen

      - name: Ruff
        run: make lint

  # Shell-script lint gate. Same shape as the ruff job: ``make shellcheck``
  # is the shared entrypoint and shellcheck is pinned in the dev extra.
  shellcheck:
    name: Lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies (incl. dev)
        run: uv sync --extra dev --frozen

      - name: shellcheck
        run: make shellcheck

  # Alert-rule gate (Phase 3d cycle 5e). `promtool check rules` plus the
  # promtool unit tests in docs/observability/prometheus-alerts.test.yaml,
  # run from the Prometheus image (docker is on the runner). PyYAML from
  # the dev sync strips annotations for the unit tests.
  alerts:
    name: Lint (promtool)
    runs-on: ubuntu-latest
    # Docker Hub rate-limits anonymous pulls per IP, and hosted runners
    # share IPs (429s blocked the v0.11.4 release PR). Only a boolean, not
    # the token, reaches the job's environment.
    env:
      HAS_DOCKERHUB_LOGIN: ${{ vars.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      # Authenticated pulls get their own quota. Skipped when the variable
      # or secret is unset (forks, Dependabot): the job pulls anonymously.
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies (incl. dev)
        run: uv sync --extra dev --frozen

      - name: promtool
        run: make alerts-check

  dashboard:
    name: Dashboard (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Install Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dashboard deps
        run: npm ci

      # ``npx tsc --noEmit`` is intentionally *not* gated here yet. The
      # pre-existing ``lib/proxy.ts:124`` ``Uint8Array<ArrayBufferLike>``
      # ↔ ``BodyInit`` complaint (flagged out-of-scope in Phase 2d CP3.4)
      # would fail this gate on day one. Re-add the step once that lands.

      - name: Vitest
        run: npm run test
