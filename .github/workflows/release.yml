# Phase 2f cycle 2: tagged release publish.
#
# Triggered by a ``git push origin v<X.Y.Z>``:
#  1. ``extract-notes`` walks CHANGELOG.md, finds the matching
#     ``## [vX.Y.Z]`` section, sets it as a job output for the
#     downstream ``release`` job.
#  2. ``build-and-push-api`` + ``build-and-push-web`` build the two
#     Dockerfiles from cycle 1 and push them to GHCR. Tags are
#     derived by ``docker/metadata-action`` from the git ref —
#     ``v<X.Y.Z>``, ``vX.Y``, ``vX``, ``latest``, and the commit SHA.
#  3. ``release`` waits for both pushes and creates the GitHub release
#     with the extracted notes as its body.
#
# Permissions:
#  * ``contents: write`` for the GitHub release.
#  * ``packages: write`` for the GHCR publish.
#  * ``id-token: write`` so cycle 3 can layer cosign keyless signing
#    on top without a permissions refactor — cycles 3 + 4 extend this
#    workflow rather than creating sibling ones.
#
# Concurrency is **not** ``cancel-in-progress`` — letting a partially
# completed publish get killed leaves GHCR in an inconsistent state
# (one image at vX.Y.Z, the other still at vX.Y.Z-1). Two concurrent
# releases of the same tag are illegal at the git layer (tag push
# fails), so the natural mutex is upstream.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository }}
  IMAGE_WEB: ${{ github.repository }}-web

jobs:
  extract-notes:
    name: Extract release notes from CHANGELOG
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.extract.outputs.notes }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Extract section for ${{ github.ref_name }}
        id: extract
        run: |
          set -euo pipefail
          # github.ref_name is the tag (e.g. ``v0.1.0``). The extractor
          # accepts either the v-prefixed or bare form.
          NOTES=$(python scripts/extract_changelog.py "${GITHUB_REF_NAME}")
          # Multi-line outputs use the heredoc form so newlines survive.
          {
            echo "notes<<EOF"
            echo "${NOTES}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  build-and-push-api:
    name: Build + push API + worker image
    runs-on: ubuntu-latest
    needs: extract-notes
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags + labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_API }}
          # ``type=semver`` parses the git tag into the *bare* semver
          # forms X.Y.Z / X.Y / X (``{{version}}`` strips the leading
          # ``v``) so a consumer can pin to whatever granularity they
          # want. Note: the published registry tags are bare — the
          # release footer and docs/release.md reflect that.
          # ``type=sha`` adds the commit SHA so an operator can always
          # trace an image back to the exact source state.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
            type=raw,value=latest

      - name: Build + push API image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Sign API image (cosign keyless)
        # Signs the immutable digest the push step emitted — any tag
        # pointing at this digest inherits the signature, so a future
        # re-tag does not invalidate consumer-side verification. The
        # ``--yes`` flag skips interactive confirmation; the OIDC
        # token comes from the workflow's id-token: write permission.
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_API }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Install Python 3.13 (for cyclonedx-py)
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync runtime deps for SBOM walk
        # ``uv sync --frozen --no-dev`` matches the production image's
        # dep set — the SBOM describes the running-image content, not
        # the dev environment.
        run: uv sync --frozen --no-dev

      - name: Generate Python SBOM (cyclonedx-py)
        # ``cyclonedx-py environment`` walks the .venv we just synced
        # and emits a CycloneDX 1.5 JSON SBOM matching the API +
        # worker image's runtime closure.
        run: |
          uv run --with cyclonedx-bom cyclonedx-py environment .venv \
            --output-format JSON \
            --output-file sbom-api.cdx.json

      - name: Attest API image SBOM (cosign in-toto)
        # ``cosign attest --type cyclonedx`` binds the SBOM to the
        # image digest as an in-toto attestation. Same Fulcio identity
        # the sign step uses, so a future cosign verify-attestation
        # gate can prove SBOM provenance from the canonical workflow
        # path without re-authenticating.
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_API }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign attest --yes \
            --type cyclonedx \
            --predicate sbom-api.cdx.json \
            "${IMAGE}@${DIGEST}"

      - name: Upload API SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-api
          path: sbom-api.cdx.json
          retention-days: 30

  build-and-push-web:
    name: Build + push dashboard image
    runs-on: ubuntu-latest
    needs: extract-notes
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags + labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
            type=raw,value=latest

      - name: Build + push dashboard image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Sign dashboard image (cosign keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Install Node 22 (for cyclonedx-npm)
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install npm deps for SBOM walk
        # cyclonedx-npm reads from the resolved node_modules tree —
        # ``npm ci`` against the lockfile matches the production
        # image's dep set.
        working-directory: web
        run: npm ci

      - name: Generate Node SBOM (cyclonedx-npm)
        working-directory: web
        run: |
          npx --yes @cyclonedx/cyclonedx-npm \
            --omit dev \
            --output-format JSON \
            --output-file ../sbom-web.cdx.json

      - name: Attest dashboard image SBOM (cosign in-toto)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign attest --yes \
            --type cyclonedx \
            --predicate sbom-web.cdx.json \
            "${IMAGE}@${DIGEST}"

      - name: Upload dashboard SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-web
          path: sbom-web.cdx.json
          retention-days: 30

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - extract-notes
      - build-and-push-api
      - build-and-push-web
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Download API SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom-api
          path: ./sbom

      - name: Download dashboard SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom-web
          path: ./sbom

      - name: Create release ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ needs.extract-notes.outputs.notes }}
        run: |
          set -euo pipefail
          # metadata-action tags images with the *bare* semver
          # (`{{version}}` strips the leading `v`), so the published
          # tags are `0.5.0` / `0.5` / `0`, not `v0.5.0`. Derive the
          # bare form from the git ref and substitute it into the body
          # via the `__VERSION__` placeholder below — pointing the
          # footer's pull/verify lines at tags that actually exist.
          VERSION="${GITHUB_REF_NAME#v}"
          # The release body is the CHANGELOG section + a footer that
          # points at the published images and explains the bundled
          # SBOM + cosign attestation surface.
          cat > release-body.md <<'BODY'
          ${{ needs.extract-notes.outputs.notes }}

          ---

          ### Published images

          - `ghcr.io/${{ github.repository }}:__VERSION__` — API + worker
          - `ghcr.io/${{ github.repository }}-web:__VERSION__` — dashboard

          Pull either with a granularity-appropriate tag (`__VERSION__`, or a
          coarser `X.Y` / `X` / `latest`).

          ### Supply-chain attestation

          Both images are signed via cosign keyless OIDC and carry an
          in-toto CycloneDX SBOM attestation. Verify with:

          ```bash
          cosign verify \
              --certificate-identity-regexp \
                  'https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*' \
              --certificate-oidc-issuer \
                  'https://token.actions.githubusercontent.com' \
              ghcr.io/${{ github.repository }}:__VERSION__
          ```

          The SBOMs are also attached as release assets:

          - `sbom-api.cdx.json` — CycloneDX SBOM of the API + worker image's Python deps
          - `sbom-web.cdx.json` — CycloneDX SBOM of the dashboard image's Node deps
          BODY

          # Substitute the bare version into the placeholder lines. The
          # heredoc is quoted (no shell expansion), so this sed pass is
          # what fills `__VERSION__` — keeping the `${{ github.* }}`
          # render-time expressions untouched.
          sed -i "s/__VERSION__/${VERSION}/g" release-body.md

          # ``gh release create … <files…>`` attaches every positional
          # file as a release asset — the SBOMs land alongside the
          # release notes for direct download (the explicit Phase 2e
          # ROADMAP requirement).
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-body.md \
            --verify-tag \
            ./sbom/sbom-api.cdx.json \
            ./sbom/sbom-web.cdx.json
