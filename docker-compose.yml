services:
  mysql:
    image: mysql:8
    container_name: wg_manager_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: wg_manager
      MYSQL_USER: wg
      MYSQL_PASSWORD: wg
    ports:
      - "3307:3306"
    volumes:
      - wg_manager_mysql_data:/var/lib/mysql
      # Phase 2d CP4.2 — bind-mount the operator-issued server cert
      # bundle (mint with `make mysql-tls-issue`) and the my.cnf
      # drop-in that turns on `require_secure_transport`. Both are
      # read-only so a compromised mysqld can't rewrite its own trust
      # anchors. The directories are committed empty; the .gitignore
      # in tls/mysql/ keeps the actual PEMs out of git.
      - ./tls/mysql:/etc/mysql/certs:ro
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro

  valkey:
    image: valkey/valkey:7-alpine
    container_name: wg_manager_valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - wg_manager_valkey_data:/data

  # Vault in `-dev` mode. Phase 2a only — see docs/vault-cookbook.md.
  # Dev mode is in-memory and unsealed at boot, which is the *point*: any
  # `docker compose down && up` resets state, and scripts/vault_smoke.py is
  # written to be idempotent so that's a feature, not a bug.
  #
  # Phase 2e audit-log cycle 1: the ``wg_manager_vault_audit_logs`` named
  # volume is mounted at ``/vault/logs/`` so that ``make
  # vault-audit-bootstrap`` (which enables a Vault file audit device
  # writing to ``/vault/logs/audit.log``) has a writable path that
  # survives container restarts. Cycle 2 (below, ``vector`` service)
  # mounts the same volume read-only into a sidecar that tails the file
  # and echoes records to its own stdout for dev visibility. A
  # production Vault story (file/raft storage, auto-unseal, off-host
  # audit shipping) is tracked in docs/vault-cookbook.md.
  vault:
    image: hashicorp/vault:1.18
    container_name: wg_manager_vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-only-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      # VAULT_DEV_ROOT_TOKEN_ID configures the server; VAULT_TOKEN
      # configures the *CLI* inside the container, so that
      # ``docker compose exec vault vault …`` invocations
      # (cookbook §6 smoke flows) authenticate without an extra
      # ``-e VAULT_TOKEN=…`` flag. Safe to bake in because this is
      # the dev compose file — the root token is already a literal
      # string above and the entire container is throwaway state.
      VAULT_TOKEN: dev-only-root
    command: ["server", "-dev"]
    ports:
      - "8200:8200"
    volumes:
      - wg_manager_vault_audit_logs:/vault/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Phase 2e audit-log cycle 2 — vector sidecar that tails the Vault
  # file audit device (cycle 1) and echoes every record to its own
  # stdout. ``docker compose logs vector`` is then the live audit
  # feed. The audit volume is mounted **read-only** so the sidecar
  # can never rewrite the trail it is shipping (defence in depth on
  # top of the kernel-level :ro guarantee). Cycle 3 swaps in
  # production-grade sinks (Loki / CloudWatch / S3 + Object Lock)
  # alongside the console sink — see docs/vault-cookbook.md §6.
  #
  # Image pin: bump via the dependabot ``docker`` ecosystem (added in
  # the same cycle this service lands) so a supply-chain swap is
  # PR-reviewable rather than a silent ``compose pull``.
  vector:
    image: timberio/vector:0.41.1-alpine
    container_name: wg_manager_vector
    restart: unless-stopped
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - wg_manager_vault_audit_logs:/vault/logs:ro
      - ./docker/vector/vault-audit.toml:/etc/vector/vector.toml:ro

  # Phase 2c CP5 — dockerised sshd that the ``tests/e2e/`` suite
  # provisions against. Gated behind the ``e2e`` compose profile so
  # ``make db-up`` doesn't pull it in; ``make e2e-up`` (or pytest's
  # auto-fixture) brings it up explicitly. The bind-mounted volume
  # at ``/wg-manager-e2e/`` carries the per-session CA pubkey + host
  # cert that the test fixture writes after Vault bootstraps; see
  # ``tests/e2e/Dockerfile`` for the layout.
  sshd-e2e:
    build:
      context: ./tests/e2e
      dockerfile: Dockerfile
    image: wg-manager/sshd-e2e:latest
    container_name: wg_manager_sshd_e2e
    profiles: ["e2e"]
    ports:
      # Host port 2222 → container 22. Keeps it out of the way of the
      # operator's own sshd on macOS (port 22).
      - "2222:22"
    volumes:
      - wg_manager_sshd_e2e_state:/wg-manager-e2e

volumes:
  wg_manager_mysql_data:
  wg_manager_valkey_data:
  wg_manager_sshd_e2e_state:
  # Phase 2e audit-log cycle 1 — Vault file audit device writes
  # /vault/logs/audit.log into this volume. Persists across compose
  # restarts so the audit trail survives the dev workflow.
  wg_manager_vault_audit_logs:
