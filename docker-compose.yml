services:
  mysql:
    image: mysql:8
    container_name: wg_manager_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: wg_manager
      MYSQL_USER: wg
      MYSQL_PASSWORD: wg
    ports:
      - "3307:3306"
    volumes:
      - wg_manager_mysql_data:/var/lib/mysql

  valkey:
    image: valkey/valkey:7-alpine
    container_name: wg_manager_valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - wg_manager_valkey_data:/data

  # Vault in `-dev` mode. Phase 2a only — see docs/vault-cookbook.md.
  # Dev mode is in-memory and unsealed at boot, which is the *point*: any
  # `docker compose down && up` resets state, and scripts/vault_smoke.py is
  # written to be idempotent so that's a feature, not a bug. A production
  # Vault story (file/raft storage, auto-unseal, audit log shipping) is
  # tracked in docs/vault-cookbook.md and lands in Phase 2e.
  vault:
    image: hashicorp/vault:1.18
    container_name: wg_manager_vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-only-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    command: ["server", "-dev"]
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Phase 2c CP5 — dockerised sshd that the ``tests/e2e/`` suite
  # provisions against. Gated behind the ``e2e`` compose profile so
  # ``make db-up`` doesn't pull it in; ``make e2e-up`` (or pytest's
  # auto-fixture) brings it up explicitly. The bind-mounted volume
  # at ``/wg-manager-e2e/`` carries the per-session CA pubkey + host
  # cert that the test fixture writes after Vault bootstraps; see
  # ``tests/e2e/Dockerfile`` for the layout.
  sshd-e2e:
    build:
      context: ./tests/e2e
      dockerfile: Dockerfile
    image: wg-manager/sshd-e2e:latest
    container_name: wg_manager_sshd_e2e
    profiles: ["e2e"]
    ports:
      # Host port 2222 → container 22. Keeps it out of the way of the
      # operator's own sshd on macOS (port 22).
      - "2222:22"
    volumes:
      - wg_manager_sshd_e2e_state:/wg-manager-e2e

volumes:
  wg_manager_mysql_data:
  wg_manager_valkey_data:
  wg_manager_sshd_e2e_state:
